spring.application.name=campus-connect-backend

server.port=8080

# H2 (dev, persistent file)
# Previously this used an in-memory DB (jdbc:h2:mem:cc) which resets on every backend restart.
spring.datasource.url=jdbc:h2:file:./data/cc;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# JWT (dev secret; replace in prod)
app.security.jwt.secret=change-me-change-me-change-me-change-me-change-me
app.security.jwt.expiration-seconds=86400

